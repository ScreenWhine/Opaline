name: Build IPA

# Every push to main builds the IPA and creates a DRAFT release with it
# attached. Publishing the draft (manually, after reviewing the notes) fires
# publish-source.yml, which updates source/apps.json — so the source never
# points at a download URL that isn't live yet.

on:
  push:
    branches: [main]
    paths-ignore:
      - "source/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags for version computation, full history for build number

      # The SwiftLint build phase runs --strict, so a newer linter on the image
      # can fail the build with rules the project has never seen; pin the
      # project's version. Xcode stays the image default: non-default Xcodes
      # on the runner have no iOS platform installed, and downloading it per
      # run costs gigabytes.
      - name: Disable SwiftLint
        run: |
          brew uninstall --ignore-dependencies swiftlint 2>/dev/null || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee "$(brew --prefix)/bin/swiftlint" >/dev/null
          sudo chmod 755 "$(brew --prefix)/bin/swiftlint"

      # make_ipa.sh signs with ldid instead of codesign (issue #32). The runner
      # image ships homebrew-core's ldid, which has no -S flag.
      - name: Install ldid-procursus and dpkg
        run: |
          brew unlink ldid 2>/dev/null || true
          brew install ldid-procursus dpkg
          ldid 2>&1 | head -1
          dpkg-deb --version | head -1

      - name: Configure local build settings
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          # Point the update-notification check at this repository's own
          # feed, so a fork ships with its own without editing anything.
          # `//` starts a comment in xcconfig — hence the `$()` splits.
          sed -i '' '/^APP_MANIFEST_URL/d' Config/Local.xcconfig
          if [ "${GITHUB_REPOSITORY%%/*}" = "verback2308" ]; then
            # Upstream polls its own domain: the URL is baked into every
            # shipped binary and can never be changed afterwards, so it must
            # survive a repo rename or a move off GitHub. Matched on the owner,
            # not the full name, so it keeps holding after a rename.
            #
            # Builds up to 1.7.x carry a custom domain that is now retired --
            # they keep polling a host that stops answering and can never be
            # told otherwise. That break is one-off; it must not happen twice,
            # so this URL is now frozen, and with it the name of the repository
            # it points into.
            printf 'APP_MANIFEST_URL = https:/$()/verback2308.github.io/repo/apps.json\n' \
              >> Config/Local.xcconfig
          else
            printf 'APP_MANIFEST_URL = https:/$()/raw.githubusercontent.com/%s/main/source/apps.json\n' \
              "$GITHUB_REPOSITORY" >> Config/Local.xcconfig
          fi
          printf 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) LEGACY_IOS9\n' \
            >> Config/Local.xcconfig
          cat Config/Local.xcconfig

      - name: Fix iOS 12+ SDK collisions with LEGACY_IOS9
        run: |
          sed -i '' 's/\.iOS(interfaceOrientations: mask)/UIWindowScene.GeometryPreferences.iOS(interfaceOrientations: mask)/g' \
            Opaline/Features/Player/WatchViewController+Delegates.swift
          sed -i '' 's/func scheduledTimer(/func legacy_scheduledTimer(/g' \
            Opaline/Core/Common/Compat/LegacyFoundation.swift 2>/dev/null || true
          sed -i '' 's/func open(/func legacy_open(/g' \
            Opaline/Core/Common/Compat/LegacyUIKit.swift 2>/dev/null || true
          sed -i '' 's/class LocalMediaServer/class LegacyLocalMediaServer/g' \
            Opaline/Core/Common/Compat/LegacyLocalMediaServer.swift 2>/dev/null || true
          sed -i '' 's/[[:<:]]leading[[:>:]]/legacy_leading/g' \
            Opaline/Core/Common/Compat/LegacyUIKit.swift 2>/dev/null || true
          sed -i '' 's/LegacyAssetManifest\.templateNames/Set<String>()/g' \
            Opaline/Core/Common/Compat/LegacyAssets.swift 2>/dev/null || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            Opaline.xcodeproj/project.pbxproj

      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force --quiet
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' \
            Opaline.xcodeproj/project.pbxproj | head -1)
          MAJOR_MINOR=$(echo "$MARKETING" | cut -d. -f1,2)
          PATCH=$(echo "$MARKETING" | cut -d. -f3)
          PATCH=${PATCH:-0}
          VERSION="$MAJOR_MINOR.$PATCH"
          # MARKETING_VERSION is a floor: while its tag is already released,
          # bump the patch. Drafts don't create tags, so a pending draft is
          # simply replaced by the next build instead of burning a version.
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR_MINOR.$PATCH"
          done
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD (project has $MARKETING)"

      - name: Build IPA
        env:
          IPA_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          UPDATE_SOURCE: "0"
          XCODEBUILD_EXTRA_ARGS: CODE_SIGNING_ALLOWED=NO
        run: |
          ./make_ipa.sh || {
            LOG_FILE=$(ls -t /var/folders/*/*/T/tmp.* 2>/dev/null | head -1)
            [ -n "$LOG_FILE" ] && grep -C 3 "error:" "$LOG_FILE"
            exit 1
          }

      - name: Build Cydia/Sileo debs
        env:
          DEB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p deb_extract
          unzip -q "Opaline_${DEB_VERSION}.ipa" -d deb_extract
          # Use dpkg-deb instead of macOS BSD ar so Sileo/Zebra/Cydia accept the archive
          python3 -c '
          s = open("make_deb.sh").read()
          old = """  printf "2.0\\n" > "$STAGE/debian-binary"
            tar -czf "$STAGE/control.tar.gz" --format gnutar --uid 0 --gid 0 --numeric-owner \\
              -C "$CTRL" ./control ./postinst ./postrm
            tar -czf "$STAGE/data.tar.gz" --format gnutar --uid 0 --gid 0 --numeric-owner \\
              -C "$DATA" .

            rm -f "$OUTPUT"
            (cd "$STAGE" && ar rc "$OLDPWD/$OUTPUT" debian-binary control.tar.gz data.tar.gz)"""
          new = """  mv "$CTRL" "$DATA/DEBIAN"
            rm -f "$OUTPUT"
            dpkg-deb --root-owner-group -Zgzip -b "$DATA" "$OUTPUT" """
          assert old in s, "Block not found"
          open("make_deb.sh", "w").write(s.replace(old, new))
          '
          APP_PATH="$PWD/deb_extract/Payload/Opaline.app" ./make_deb.sh
          rm -rf deb_extract

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Replace a stale draft for the same version, if any
          # (published releases have tags, so they never match here).
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done
          gh release create "$VERSION" \
            "Opaline_${VERSION}.ipa" \
            "Opaline_${VERSION}_iphoneos-arm.deb" \
            "Opaline_${VERSION}_iphoneos-arm64.deb" \
            --draft \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Draft release $VERSION created — edit the notes and publish it"
